<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1150" viewBox="0 0 1800 1150" font-family="Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="#0B1020"/>

<text x="70" y="82" fill="#F8FAFC" font-size="46" font-weight="700">Fact It &#8212; Browser Extension Architecture</text>
<text x="72" y="120" fill="#94A3B8" font-size="23">Manifest V3 &#8226; BYOK &#8226; local extraction &#8226; privileged provider calls &#8226; no Fact It backend</text>

<rect x="50" y="165" width="470" height="820" rx="30" fill="#111827" stroke="#334155" stroke-width="3"/>
<rect x="555" y="165" width="840" height="820" rx="30" fill="#0F172A" stroke="#475569" stroke-width="3"/>
<rect x="1430" y="165" width="320" height="820" rx="30" fill="#111827" stroke="#334155" stroke-width="3"/>
<text x="80" y="214" fill="#FCA5A5" font-size="25" font-weight="700">UNTRUSTED WEB PAGE</text>
<text x="80" y="242" fill="#94A3B8" font-size="17">http / https article</text>
<text x="585" y="214" fill="#93C5FD" font-size="25" font-weight="700">CHROMIUM EXTENSION</text>
<text x="585" y="242" fill="#94A3B8" font-size="17">isolated world + privileged extension contexts</text>
<text x="1460" y="214" fill="#C4B5FD" font-size="25" font-weight="700">EXTERNAL</text>
<text x="1460" y="242" fill="#94A3B8" font-size="17">user-chosen AI provider</text>

<rect x="110" y="315" width="350" height="230" rx="24" fill="#1F2937" stroke="#64748B" stroke-width="2"/>
<text x="285" y="360" text-anchor="middle" fill="#FFFFFF" font-size="25" font-weight="700">Article / DOM</text>
<text x="285" y="405" text-anchor="middle" fill="#CBD5E1" font-size="18">HTML, text, metadata, links</text>
<text x="285" y="435" text-anchor="middle" fill="#CBD5E1" font-size="18">attacker-controlled input</text>
<text x="285" y="465" text-anchor="middle" fill="#CBD5E1" font-size="18">Fact It UI injected on page</text>

<rect x="600" y="290" width="330" height="295" rx="24" fill="#102A43" stroke="#38BDF8" stroke-width="3"/>
<text x="765" y="338" text-anchor="middle" fill="#FFFFFF" font-size="25" font-weight="700">Content Script</text>
<text x="765" y="380" text-anchor="middle" fill="#D6EFFF" font-size="18">Readability + extraction</text>
<text x="765" y="410" text-anchor="middle" fill="#D6EFFF" font-size="18">normalization &#8594; ArticleDocument</text>
<text x="765" y="440" text-anchor="middle" fill="#D6EFFF" font-size="18">SHA-256 content hash</text>
<text x="765" y="470" text-anchor="middle" fill="#D6EFFF" font-size="18">top bar + detail panel</text>
<text x="765" y="500" text-anchor="middle" fill="#D6EFFF" font-size="18">closed shadow root</text>
<text x="765" y="558" text-anchor="middle" fill="#7DD3FC" font-size="15">runs at document_idle &#8226; isolated world</text>

<rect x="1015" y="285" width="350" height="365" rx="24" fill="#172554" stroke="#60A5FA" stroke-width="3"/>
<text x="1190" y="333" text-anchor="middle" fill="#FFFFFF" font-size="24" font-weight="700">Background Service Worker</text>
<text x="1190" y="375" text-anchor="middle" fill="#DBEAFE" font-size="18">message authorization</text>
<text x="1190" y="405" text-anchor="middle" fill="#DBEAFE" font-size="18">cache lookup / orchestration</text>
<text x="1190" y="435" text-anchor="middle" fill="#DBEAFE" font-size="18">prompt construction</text>
<text x="1190" y="465" text-anchor="middle" fill="#DBEAFE" font-size="18">provider adapter</text>
<text x="1190" y="495" text-anchor="middle" fill="#DBEAFE" font-size="18">schema validation</text>
<text x="1190" y="525" text-anchor="middle" fill="#DBEAFE" font-size="18">usage / cost accounting</text>
<text x="1190" y="610" text-anchor="middle" fill="#93C5FD" font-size="15">the only network egress in the extension</text>

<rect x="600" y="695" width="330" height="170" rx="24" fill="#1E293B" stroke="#A78BFA" stroke-width="3"/>
<text x="765" y="742" text-anchor="middle" fill="#FFFFFF" font-size="25" font-weight="700">Options Page</text>
<text x="765" y="784" text-anchor="middle" fill="#EDE9FE" font-size="18">provider / model / base URL</text>
<text x="765" y="814" text-anchor="middle" fill="#EDE9FE" font-size="18">API key entry</text>
<text x="765" y="844" text-anchor="middle" fill="#EDE9FE" font-size="18">test connection</text>

<rect x="1015" y="705" width="350" height="190" rx="24" fill="#231942" stroke="#F472B6" stroke-width="3"/>
<text x="1190" y="752" text-anchor="middle" fill="#FFFFFF" font-size="25" font-weight="700">chrome.storage.local</text>
<text x="1190" y="794" text-anchor="middle" fill="#FCE7F3" font-size="18">settings + API key</text>
<text x="1190" y="824" text-anchor="middle" fill="#FCE7F3" font-size="18">validated analysis cache</text>
<text x="1190" y="854" text-anchor="middle" fill="#FCE7F3" font-size="18">usage totals</text>

<rect x="1480" y="345" width="220" height="270" rx="24" fill="#2E1065" stroke="#C084FC" stroke-width="3"/>
<text x="1590" y="393" text-anchor="middle" fill="#FFFFFF" font-size="25" font-weight="700">AI Provider</text>
<text x="1590" y="438" text-anchor="middle" fill="#F3E8FF" font-size="18">OpenAI</text>
<text x="1590" y="468" text-anchor="middle" fill="#F3E8FF" font-size="18">Anthropic</text>
<text x="1590" y="498" text-anchor="middle" fill="#F3E8FF" font-size="18">OpenAI-compatible</text>
<text x="1590" y="528" text-anchor="middle" fill="#F3E8FF" font-size="18">Ollama / LM Studio</text>

<defs>
<marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L0,6 L9,3 z" fill="#60A5FA"/></marker>
<marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L0,6 L9,3 z" fill="#C084FC"/></marker>
<marker id="k" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L0,6 L9,3 z" fill="#F472B6"/></marker>
<marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L0,6 L9,3 z" fill="#FB7185"/></marker>
</defs>

<line x1="462" y1="405" x2="598" y2="405" stroke="#38BDF8" stroke-width="4" marker-end="url(#a)"/>
<text x="530" y="394" text-anchor="middle" fill="#7DD3FC" font-size="16">DOM read</text>
<line x1="598" y1="520" x2="462" y2="520" stroke="#38BDF8" stroke-width="4" marker-end="url(#a)"/>
<text x="530" y="545" text-anchor="middle" fill="#7DD3FC" font-size="16">rendered as text</text>

<line x1="932" y1="405" x2="1013" y2="405" stroke="#60A5FA" stroke-width="4" marker-end="url(#a)"/>
<text x="972" y="376" text-anchor="middle" fill="#93C5FD" font-size="15">runtime</text>
<text x="972" y="393" text-anchor="middle" fill="#93C5FD" font-size="15">message</text>
<line x1="1013" y1="540" x2="932" y2="540" stroke="#60A5FA" stroke-width="4" marker-end="url(#a)"/>
<text x="972" y="568" text-anchor="middle" fill="#93C5FD" font-size="15">validated</text>
<text x="972" y="585" text-anchor="middle" fill="#93C5FD" font-size="15">result</text>

<line x1="1367" y1="430" x2="1478" y2="430" stroke="#C084FC" stroke-width="4" marker-end="url(#p)"/>
<text x="1422" y="406" text-anchor="middle" fill="#D8B4FE" font-size="15">HTTPS request</text>
<text x="1422" y="423" text-anchor="middle" fill="#D8B4FE" font-size="15">article + BYOK</text>
<line x1="1478" y1="545" x2="1367" y2="545" stroke="#C084FC" stroke-width="4" marker-end="url(#p)"/>
<text x="1422" y="568" text-anchor="middle" fill="#D8B4FE" font-size="15">JSON /</text>
<text x="1422" y="585" text-anchor="middle" fill="#D8B4FE" font-size="15">model output</text>

<line x1="1190" y1="652" x2="1190" y2="703" stroke="#F472B6" stroke-width="4" marker-end="url(#k)"/>
<text x="1207" y="684" fill="#F9A8D4" font-size="16">settings / cache</text>
<line x1="932" y1="790" x2="1013" y2="790" stroke="#F472B6" stroke-width="4" marker-end="url(#k)"/>
<text x="972" y="775" text-anchor="middle" fill="#F9A8D4" font-size="16">read / write</text>

<line x1="870" y1="587" x2="1073" y2="703" stroke="#FB7185" stroke-width="4" stroke-dasharray="10 10" marker-end="url(#r)"/>
<text x="845" y="640" text-anchor="end" fill="#FDA4AF" font-size="16" font-weight="700">REACHABLE,</text>
<text x="845" y="660" text-anchor="end" fill="#FDA4AF" font-size="16" font-weight="700">NOT USED</text>
<text x="845" y="681" text-anchor="end" fill="#FDA4AF" font-size="14">no Fact It code reads the key here</text>

<rect x="90" y="700" width="380" height="195" rx="20" fill="#2A1014" stroke="#FB7185" stroke-width="2"/>
<text x="115" y="740" fill="#FDA4AF" font-size="24" font-weight="700">Key trust boundaries</text>
<text x="115" y="780" fill="#FECACA" font-size="16">1. Page &#8594; content script: untrusted DOM</text>
<text x="115" y="810" fill="#FECACA" font-size="16">2. Content &#8594; background: re-check messages</text>
<text x="115" y="840" fill="#FECACA" font-size="16">3. Provider &#8594; background: untrusted output</text>
<text x="115" y="870" fill="#FECACA" font-size="16">4. Validated result &#8594; UI: text only</text>

<rect x="50" y="1015" width="1700" height="95" rx="24" fill="#111827" stroke="#334155" stroke-width="3"/>
<line x1="90" y1="1062" x2="150" y2="1062" stroke="#60A5FA" stroke-width="4"/>
<text x="166" y="1068" fill="#CBD5E1" font-size="18">trusted extension data flow</text>
<line x1="500" y1="1062" x2="560" y2="1062" stroke="#FB7185" stroke-width="4" stroke-dasharray="10 10"/>
<text x="576" y="1068" fill="#CBD5E1" font-size="18">platform-reachable path (see SECURITY.md)</text>
<text x="1100" y="1068" fill="#86EFAC" font-size="18">No Fact It backend or server in V1</text>
</svg>
